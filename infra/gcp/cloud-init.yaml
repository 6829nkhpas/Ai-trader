#cloud-config
# Bootstraps an Ubuntu 22.04 (x86_64) GCE instance with Docker Engine + the compose
# plugin, and prepares the paths redeploy.sh expects.
#
# Ported from the retired DigitalOcean cloud-init. The Docker install is unchanged;
# what is new is everything the droplet got for free by deploying as root:
#
#   * a non-root deploy user in the `docker` group. GCP's Ubuntu images ship
#     `PermitRootLogin without-password` and let the guest agent manage keys, so
#     deploying as root means fighting the platform.
#   * ${deploy_path}, owned by that user, because it cannot live under /root.
#   * /srv/vendor and /srv/updates, which redeploy.sh reads and CI writes into.
#
# Templated by Terraform — ${deploy_user} and ${deploy_path} are substituted in.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - gnupg

groups:
  - docker

users:
  - default
  - name: ${deploy_user}
    gecos: StratAI deploy
    shell: /bin/bash
    groups: [docker]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true

write_files:
  # Cap the journal so a chatty container cannot fill 160 GB and take QuestDB's
  # writes down with it. The droplet had no such limit.
  - path: /etc/systemd/journald.conf.d/10-stratai.conf
    content: |
      [Journal]
      SystemMaxUse=1G
      SystemMaxFileSize=128M

  # Same reasoning for container logs. `docker compose logs` stays useful; unbounded
  # growth does not.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "64m", "max-file": "3" }
      }

runcmd:
  # ── Docker Engine + compose plugin (unchanged from the droplet bootstrap) ────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # ── Paths redeploy.sh depends on ─────────────────────────────────────────────
  # /srv/vendor holds the TradingView charting library OUTSIDE the repo, so
  # `git reset --hard` cannot touch it and no GitHub credential is needed for the
  # private submodule. redeploy.sh hard-FAILS when it is missing, by design — a
  # frontend built without it looks healthy and every chart 404s.
  - mkdir -p /srv/vendor /srv/updates ${deploy_path}
  # `dirname` rather than a hardcoded /opt/stratai, so overriding `deploy_path`
  # cannot leave the repo's parent owned by root and the clone failing.
  - chown -R ${deploy_user}:${deploy_user} /srv/vendor /srv/updates "$(dirname ${deploy_path})"

  # QuestDB wants a high mmap/file-handle ceiling; it warns loudly and degrades
  # without it. The droplet inherited DO's defaults, which happened to be enough —
  # this makes it explicit rather than lucky.
  - sysctl -w vm.max_map_count=1048576
  - echo "vm.max_map_count=1048576" > /etc/sysctl.d/60-questdb.conf
  - echo "fs.file-max=1048576" >> /etc/sysctl.d/60-questdb.conf

  - docker --version > /var/log/stratai-bootstrap.log 2>&1
  - docker compose version >> /var/log/stratai-bootstrap.log 2>&1
  - echo "stratai bootstrap complete" >> /var/log/stratai-bootstrap.log

final_message: "stratai GCE instance ready after $UPTIME seconds"
