#cloud-config
# Bootstraps an Ubuntu 22.04 (ARM64) host with Docker Engine + the compose plugin
# and opens the data-plane ports in the instance-level firewall (Oracle images
# ship restrictive iptables). Runs once on first boot.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - gnupg

write_files:
  # Persist iptables rules across reboots without prompts
  - path: /etc/stratai/open-ports.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      # Data-plane service ports + SSH (22 already allowed by default)
      for p in 8080 8081 8082 8083 8085 8087; do
        iptables -C INPUT -p tcp --dport "$p" -j ACCEPT 2>/dev/null || \
          iptables -I INPUT -p tcp --dport "$p" -j ACCEPT
      done
      netfilter-persistent save || true

runcmd:
  # ── Docker Engine + compose plugin (official repo, arm64) ──
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin iptables-persistent
  - systemctl enable --now docker
  # Let the default 'ubuntu' user run docker without sudo
  - usermod -aG docker ubuntu
  # Open service ports at the instance firewall
  - /etc/stratai/open-ports.sh
  - docker --version > /var/log/stratai-bootstrap.log 2>&1
  - echo "stratai bootstrap complete" >> /var/log/stratai-bootstrap.log

final_message: "stratai host ready after $UPTIME seconds"
