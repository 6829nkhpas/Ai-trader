#cloud-config
# Bootstraps an Ubuntu 22.04 (x86_64) droplet with Docker Engine + compose plugin.
# DigitalOcean's Cloud Firewall (defined in Terraform) handles ingress at the
# network edge, and DO Ubuntu images ship with ufw inactive, so no host-level
# firewall rules are needed here.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - gnupg

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - docker --version > /var/log/stratai-bootstrap.log 2>&1
  - echo "stratai bootstrap complete" >> /var/log/stratai-bootstrap.log

final_message: "stratai droplet ready after $UPTIME seconds"
