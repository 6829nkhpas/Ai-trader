# ──────────────────────────────────────────────────────────────────────────────
# Strat Ai — PRODUCTION Compose (Oracle Cloud ARM / Ampere A1, 24GB, ~10-user beta)
# ──────────────────────────────────────────────────────────────────────────────
# This is the deployment topology for the SHARED BACKEND DATA PLANE. Beta users
# run the packaged Tauri desktop app locally, pointed at this host's public IP
# (Topology A). The reasoning plane (deep-quant Python agent + Rust tool server)
# runs client-side inside the desktop app and is intentionally NOT hosted here.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build           # core data plane
#   docker compose -f docker-compose.prod.yml --profile platform up -d --build  # + auth/payment
#   docker compose -f docker-compose.prod.yml logs -f ingestion
#   docker compose -f docker-compose.prod.yml down
#
# Prerequisites:
#   - Docker Engine 24+ with the compose v2 plugin
#   - A .env file at repo root (see .env.example + DEPLOYMENT.md checklist)
#
# Resource budget (mem_limit sum ≈ 9.5 GB of the 24 GB box — generous headroom):
#   redpanda 1.5G · questdb 4G · postgres 512M · redis 256M · app services 256–384M each
# ──────────────────────────────────────────────────────────────────────────────

name: stratai

networks:
  stratai:
    driver: bridge

volumes:
  questdb_data:
  postgres_data:
  redis_data:
  caddy_data:      # Caddy TLS certs + ACME account (app.stratai.live gateway)
  caddy_config:    # Caddy autosave config

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: stratai-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      - --set auto_create_topics_enabled=true
    networks: [stratai]
    ports:
      - "127.0.0.1:19092:19092"   # external Kafka API — localhost only (SSH tunnel for debug)
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      # `rpk cluster health` prints "Healthy: true" (mixed case) — match case-insensitively.
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy | grep -qi true"]
      interval: 10s
      timeout: 5s
      retries: 12

  questdb:
    image: questdb/questdb:latest
    container_name: stratai-questdb
    environment:
      # Trim worker threads to fit the 4-OCPU box and leave cores for app services.
      QDB_SHARED_WORKER_COUNT: "2"
      # PostgreSQL-wire auth. Password comes from the server .env (never committed).
      QDB_PG_USER: "${QUESTDB_USER:-admin}"
      QDB_PG_PASSWORD: "${QUESTDB_PASSWORD:?QUESTDB_PASSWORD must be set in .env}"
    networks: [stratai]
    ports:
      # HTTP 9000 is NOT published here — the Caddy gateway (below) fronts it with
      # basic auth and proxies over the internal 'stratai' network to questdb:9000.
      # PG wire is exposed publicly but protected by QuestDB's native user/password.
      - "0.0.0.0:8812:8812"       # PostgreSQL wire protocol (auth: QDB_PG_USER/PASSWORD)
      - "127.0.0.1:9009:9009"     # InfluxDB line protocol — localhost only
    volumes:
      - questdb_data:/var/lib/questdb
    mem_limit: 4096m
    restart: unless-stopped
    healthcheck:
      # QuestDB has no /status route (returns 404); probe a trivial query on /exec.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9000/exec?query=SELECT%201' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── QuestDB HTTP Gateway (Caddy basic-auth reverse proxy) ─────────────────
  # Public :9000 → basic auth → internal questdb:9000. The desktop thin client
  # sends Authorization: Basic <user:pass> on every /exec request (see
  # server::questdb_user/questdb_password baked into release builds).
  questdb-gateway:
    image: caddy:2-alpine
    container_name: stratai-questdb-gateway
    depends_on:
      - questdb
    environment:
      QUESTDB_USER: "${QUESTDB_USER:-admin}"
      # bcrypt hash of QUESTDB_PASSWORD (generate with: caddy hash-password).
      QUESTDB_PASSWORD_HASH: "${QUESTDB_PASSWORD_HASH:?QUESTDB_PASSWORD_HASH must be set in .env}"
    networks: [stratai]
    ports:
      - "0.0.0.0:80:80"           # HTTP — Let's Encrypt ACME challenge for app.stratai.live
      - "0.0.0.0:443:443"         # HTTPS — app.stratai.live gateway: WSS feeds + /questdb + /deepquant
      # QuestDB HTTP (:9000) and deep-quant (:8086) are no longer published to the
      # host — they are served over TLS at https://app.stratai.live/questdb and
      # /deepquant. Caddy still reaches them internally as questdb:9000 /
      # deep-quant:8086. (Re-add these mappings only for legacy direct-IP clients.)
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued TLS certificates + ACME account across restarts so Caddy
      # does NOT re-issue on every redeploy (avoids Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: stratai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-alpha}
    networks: [stratai]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stratai-redis
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [stratai]
    volumes:
      - redis_data:/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Kafka topic pre-creation (runs once, then exits) ─────────────────────────
  kafka-init:
    image: redpandadata/redpanda:latest
    container_name: stratai-kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [stratai]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in market.ticks market.ohlc.10m technical_signals sentiment_signals \
                 signals.predictive signals.insights trade_decisions aggregated_decisions; do
          rpk topic create "$$t" --brokers redpanda:29092 --partitions 3 || true
        done
        echo "Topics ready:"; rpk topic list --brokers redpanda:29092
    restart: "no"

  # ── Data-plane services ──────────────────────────────────────────────────────

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: stratai-ingestion
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      # Aligned with QuestDB's native PG-wire password (QDB_PG_PASSWORD). ILP (9009)
      # is unauthenticated in QuestDB OSS, so ingestion writes are unaffected.
      QUESTDB_POSTGRES_URL: postgresql://${QUESTDB_USER:-admin}:${QUESTDB_PASSWORD}@questdb:8812/qdb
      QUESTDB_ILP_ADDR: questdb:9009
      INGESTION_CONTROL_PORT: "8085"
      RUST_LOG: info
    networks: [stratai]
    ports:
      - "8085:8085"     # TCP control (desktop clients send subscription diffs)
    depends_on:
      redpanda:
        condition: service_healthy
      questdb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped

  alpha-terminal:
    build:
      context: .
      dockerfile: alpha-terminal/Dockerfile
    container_name: stratai-alpha-terminal
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      OHLC_WEBSOCKET_PORT: "8081"
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as alpha-terminal:8081).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  technical:
    build:
      context: .
      dockerfile: agents/technical/Dockerfile
    container_name: stratai-technical
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      RUST_LOG: info
    networks: [stratai]
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    container_name: stratai-aggregator
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      WEBSOCKET_PORT: "8080"
      KITE_API_PORT: "8087"
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as aggregator:8080).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  predictive:
    build:
      context: .
      dockerfile: agents/predictive/Dockerfile
    container_name: stratai-predictive
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as predictive:8082).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  quant-rag:
    build:
      context: .
      dockerfile: agents/quant-rag/Dockerfile
    container_name: stratai-quant-rag
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as quant-rag:8083).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped

  sentiment:
    build:
      context: .
      dockerfile: agents/sentiment/Dockerfile
    container_name: stratai-sentiment
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    networks: [stratai]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped

  # ── Market-data Tool Server (Tauri-free, :8084, internal-only) ───────────────
  # The headless extraction of the desktop quant tool_server. The deep-quant
  # LangGraph agent calls its /tools/* endpoints over the internal network. It
  # reads QuestDB via PG wire and shares the quant-core engine with the desktop
  # app (one source of truth). NOT exposed publicly.
  tool-server:
    build:
      context: .
      dockerfile: tool-server/Dockerfile
    container_name: stratai-tool-server
    env_file: .env
    environment:
      QUANT_TOOL_SERVER_PORT: "8084"
      QUESTDB_POSTGRES_URL: postgresql://${QUESTDB_USER:-admin}:${QUESTDB_PASSWORD}@questdb:8812/qdb
      DEEP_QUANT_URL: "http://deep-quant:8086"
      # Node sentiment service has no HTTP endpoint yet; get_news_context degrades
      # to Google-News RSS headlines when this is unreachable (honest fallback).
      SENTIMENT_SERVICE_URL: "http://sentiment:8090/sentiment"
      RUST_LOG: info
    networks: [stratai]
    depends_on:
      questdb:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  # ── Deep Quant AI service (LangGraph glass-box, :8086) ───────────────────────
  # The desktop thin client drives AI analysis by POSTing /run, /qa, /resume to
  # this service. It calls the Rust tool-server (:8084) for market-data tools and
  # QuestDB HTTP (:9000, internal — no Caddy auth on the private network) for the
  # options read layer, both over the 'stratai' network.
  #
  # NOTE: port 8086 is intentionally NOT published to the host yet. The desktop
  # reaches it via an authenticated Caddy gateway (added once the tool-server is
  # hosted and the end-to-end path is verified), mirroring the QuestDB gateway.
  deep-quant:
    build:
      context: ./agents/deep-quant-loop
      dockerfile: Dockerfile
    container_name: stratai-deep-quant
    env_file: .env
    environment:
      DEEP_QUANT_HOST: "0.0.0.0"
      DEEP_QUANT_PORT: "8086"
      # Internal service wiring (stratai network hostnames).
      RUST_TOOL_SERVER_URL: "http://tool-server:8084"
      QUESTDB_HTTP_URL: "http://questdb:9000"
    networks: [stratai]
    depends_on:
      questdb:
        condition: service_healthy
      tool-server:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  # ── Platform services (opt-in: --profile platform) ───────────────────────────
  # Not required for a closed beta that skips login/billing. Enable when you need
  # user auth / payments. Both use Prisma against the shared postgres.

  auth-service:
    build:
      context: ./alpha-backend
      dockerfile: services/auth-service/Dockerfile
    container_name: stratai-auth
    profiles: ["platform"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD:-alpha_dev_pw}@postgres:5432/${POSTGRES_DB:-alpha}
      REDIS_URL: redis://redis:6379
    networks: [stratai]
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

  payment-service:
    build:
      context: ./alpha-backend
      dockerfile: services/payment-service/Dockerfile
    container_name: stratai-payment
    profiles: ["platform"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD:-alpha_dev_pw}@postgres:5432/${POSTGRES_DB:-alpha}
    networks: [stratai]
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
