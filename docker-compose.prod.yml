# ──────────────────────────────────────────────────────────────────────────────
# Strat Ai — PRODUCTION Compose (Oracle Cloud ARM / Ampere A1, 24GB, ~10-user beta)
# ──────────────────────────────────────────────────────────────────────────────
# This is the deployment topology for the SHARED BACKEND DATA PLANE. Beta users
# run the packaged Tauri desktop app locally, pointed at this host's public IP
# (Topology A). The reasoning plane (deep-quant Python agent + Rust tool server)
# runs client-side inside the desktop app and is intentionally NOT hosted here.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build           # core data plane
#   docker compose -f docker-compose.prod.yml --profile platform up -d --build  # + auth/payment
#   docker compose -f docker-compose.prod.yml logs -f ingestion
#   docker compose -f docker-compose.prod.yml down
#
# Prerequisites:
#   - Docker Engine 24+ with the compose v2 plugin
#   - A .env file at repo root (see .env.example + DEPLOYMENT.md checklist)
#
# Resource budget (mem_limit sum ≈ 9.5 GB of the 24 GB box — generous headroom):
#   redpanda 1.5G · questdb 4G · redis 256M · app services 256–384M each
# ──────────────────────────────────────────────────────────────────────────────

name: stratai

networks:
  stratai:
    driver: bridge

volumes:
  questdb_data:
  redis_data:
  caddy_data:      # Caddy TLS certs + ACME account (app-api.stratai.live gateway)
  # NOTE: the desktop update feed is a HOST BIND (/srv/updates), not a named
  # volume — CI writes into it over SSH. See the questdb-gateway volumes block.
  caddy_config:    # Caddy autosave config
  prometheus_data: # TSDB — capped at 7d / 2GB by the prometheus command flags
  grafana_data:    # Grafana's sqlite backend (users, prefs; dashboards are in git)

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: stratai-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      - --set auto_create_topics_enabled=true
    networks: [stratai]
    ports:
      - "127.0.0.1:19092:19092"   # external Kafka API — localhost only (SSH tunnel for debug)
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      # `rpk cluster health` prints "Healthy: true" (mixed case) — match case-insensitively.
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy | grep -qi true"]
      interval: 10s
      timeout: 5s
      retries: 12

  questdb:
    image: questdb/questdb:latest
    container_name: stratai-questdb
    environment:
      # Trim worker threads to fit the 4-OCPU box and leave cores for app services.
      QDB_SHARED_WORKER_COUNT: "2"
      # PostgreSQL-wire auth. Password comes from the server .env (never committed).
      QDB_PG_USER: "${QUESTDB_USER:-admin}"
      QDB_PG_PASSWORD: "${QUESTDB_PASSWORD:?QUESTDB_PASSWORD must be set in .env}"
    networks: [stratai]
    ports:
      # HTTP 9000 is NOT published here — the Caddy gateway (below) fronts it with
      # basic auth and proxies over the internal 'stratai' network to questdb:9000.
      # PG wire is exposed publicly but protected by QuestDB's native user/password.
      - "0.0.0.0:8812:8812"       # PostgreSQL wire protocol (auth: QDB_PG_USER/PASSWORD)
      - "127.0.0.1:9009:9009"     # InfluxDB line protocol — localhost only
    volumes:
      - questdb_data:/var/lib/questdb
    mem_limit: 4096m
    restart: unless-stopped
    healthcheck:
      # QuestDB has no /status route (returns 404); probe a trivial query on /exec.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9000/exec?query=SELECT%201' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── QuestDB HTTP Gateway (Caddy basic-auth reverse proxy) ─────────────────
  # Public :9000 → basic auth → internal questdb:9000. The desktop thin client
  # sends Authorization: Basic <user:pass> on every /exec request (see
  # server::questdb_user/questdb_password baked into release builds).
  questdb-gateway:
    image: caddy:2-alpine
    container_name: stratai-questdb-gateway
    depends_on:
      - questdb
    environment:
      QUESTDB_USER: "${QUESTDB_USER:-admin}"
      # bcrypt hash of QUESTDB_PASSWORD (generate with: caddy hash-password).
      QUESTDB_PASSWORD_HASH: "${QUESTDB_PASSWORD_HASH:?QUESTDB_PASSWORD_HASH must be set in .env}"
    networks: [stratai]
    ports:
      - "0.0.0.0:80:80"           # HTTP — Let's Encrypt ACME challenge for app-api.stratai.live
      - "0.0.0.0:443:443"         # HTTPS — app-api.stratai.live gateway: WSS feeds + /questdb + /deepquant
      # QuestDB HTTP (:9000) and deep-quant (:8086) are no longer published to the
      # host — they are served over TLS at https://app-api.stratai.live/questdb and
      # /deepquant. Caddy still reaches them internally as questdb:9000 /
      # deep-quant:8086. (Re-add these mappings only for legacy direct-IP clients.)
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued TLS certificates + ACME account across restarts so Caddy
      # does NOT re-issue on every redeploy (avoids Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config
      # Desktop auto-update feed (signed installers + latest.json manifests).
      # A host bind, not a named volume: the release workflow writes these over
      # SSH, so the path has to be reachable from outside the container. Served
      # read-only behind basic-auth at /updates/* (see infra/caddy/Caddyfile).
      - /srv/updates:/srv/updates:ro
    mem_limit: 128m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stratai-redis
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [stratai]
    volumes:
      - redis_data:/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Kafka topic pre-creation (runs once, then exits) ─────────────────────────
  kafka-init:
    image: redpandadata/redpanda:latest
    container_name: stratai-kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [stratai]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in market.ticks market.ohlc.10m technical_signals sentiment_signals \
                 signals.predictive signals.insights trade_decisions aggregated_decisions; do
          rpk topic create "$$t" --brokers redpanda:29092 --partitions 3 || true
        done
        echo "Topics ready:"; rpk topic list --brokers redpanda:29092
    restart: "no"

  # ── Data-plane services ──────────────────────────────────────────────────────

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: stratai-ingestion
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      # Aligned with QuestDB's native PG-wire password (QDB_PG_PASSWORD). ILP (9009)
      # is unauthenticated in QuestDB OSS, so ingestion writes are unaffected.
      QUESTDB_POSTGRES_URL: postgresql://${QUESTDB_USER:-admin}:${QUESTDB_PASSWORD}@questdb:8812/qdb
      QUESTDB_ILP_ADDR: questdb:9009
      INGESTION_CONTROL_PORT: "8085"
      # Prometheus /metrics /health /ready. Set explicitly on every service even
      # though each binary already defaults to its own slot: all of these share
      # `env_file: .env` and all of them read the SAME variable name, so one
      # stray METRICS_PORT in .env would collapse the whole fleet onto a single
      # port. A value in `environment:` overrides env_file, so this is the guard.
      METRICS_PORT: "9101"
      RUST_LOG: info
    networks: [stratai]
    ports:
      - "8085:8085"     # TCP control (desktop clients send subscription diffs)
    depends_on:
      redpanda:
        condition: service_healthy
      questdb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped

  alpha-terminal:
    build:
      context: .
      dockerfile: alpha-terminal/Dockerfile
    container_name: stratai-alpha-terminal
    env_file: .env
    environment:
      # Both names are set deliberately: the Rust/Node clients disagree on which
      # they read first, and .env carries a localhost value for host-side dev. An
      # env_file value would otherwise win and point the client at localhost:19092.
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      OHLC_WEBSOCKET_PORT: "8081"
      METRICS_PORT: "9103"
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app-api.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as alpha-terminal:8081).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  technical:
    build:
      context: .
      dockerfile: agents/technical/Dockerfile
    container_name: stratai-technical
    env_file: .env
    environment:
      # Both names are set deliberately: the Rust/Node clients disagree on which
      # they read first, and .env carries a localhost value for host-side dev. An
      # env_file value would otherwise win and point the client at localhost:19092.
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      METRICS_PORT: "9104"
      RUST_LOG: info
    networks: [stratai]
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    container_name: stratai-aggregator
    env_file: .env
    environment:
      # Both names are set deliberately: the Rust/Node clients disagree on which
      # they read first, and .env carries a localhost value for host-side dev. An
      # env_file value would otherwise win and point the client at localhost:19092.
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      WEBSOCKET_PORT: "8080"
      KITE_API_PORT: "8087"
      METRICS_PORT: "9102"
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app-api.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as aggregator:8080).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  predictive:
    build:
      context: .
      dockerfile: agents/predictive/Dockerfile
    container_name: stratai-predictive
    env_file: .env
    environment:
      # Both names are set deliberately: the Rust/Node clients disagree on which
      # they read first, and .env carries a localhost value for host-side dev. An
      # env_file value would otherwise win and point the client at localhost:19092.
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      METRICS_PORT: "9105"
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app-api.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as predictive:8082).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  quant-rag:
    build:
      context: .
      dockerfile: agents/quant-rag/Dockerfile
    container_name: stratai-quant-rag
    env_file: .env
    environment:
      # Both names are set deliberately: the Rust/Node clients disagree on which
      # they read first, and .env carries a localhost value for host-side dev. An
      # env_file value would otherwise win and point the client at localhost:19092.
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      METRICS_PORT: "9106"
      RUST_LOG: info
    networks: [stratai]
    # Not published to the host — fronted by the app-api.stratai.live WSS gateway
    # (Caddy reaches this over the internal network as quant-rag:8083).
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped

  sentiment:
    build:
      context: .
      dockerfile: agents/sentiment/Dockerfile
    container_name: stratai-sentiment
    env_file: .env
    environment:
      # Both names are set deliberately: the Rust/Node clients disagree on which
      # they read first, and .env carries a localhost value for host-side dev. An
      # env_file value would otherwise win and point the client at localhost:19092.
      KAFKA_BROKERS: redpanda:29092
      KAFKA_BROKER_URL: redpanda:29092
      REDIS_URL: redis://redis:6379
      METRICS_PORT: "9108"
      NODE_ENV: production
    networks: [stratai]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped

  # ── Market-data Tool Server (Tauri-free, :8084, internal-only) ───────────────
  # The headless extraction of the desktop quant tool_server. The deep-quant
  # LangGraph agent calls its /tools/* endpoints over the internal network. It
  # reads QuestDB via PG wire and shares the quant-core engine with the desktop
  # app (one source of truth). NOT exposed publicly.
  tool-server:
    build:
      context: .
      dockerfile: tool-server/Dockerfile
    container_name: stratai-tool-server
    env_file: .env
    environment:
      QUANT_TOOL_SERVER_PORT: "8084"
      QUESTDB_POSTGRES_URL: postgresql://${QUESTDB_USER:-admin}:${QUESTDB_PASSWORD}@questdb:8812/qdb
      DEEP_QUANT_URL: "http://deep-quant:8086"
      # Node sentiment service has no HTTP endpoint yet; get_news_context degrades
      # to Google-News RSS headlines when this is unreachable (honest fallback).
      SENTIMENT_SERVICE_URL: "http://sentiment:8090/sentiment"
      METRICS_PORT: "9107"
      RUST_LOG: info
    networks: [stratai]
    depends_on:
      questdb:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  # ── Deep Quant AI service (LangGraph glass-box, :8086) ───────────────────────
  # The desktop thin client drives AI analysis by POSTing /run, /qa, /resume to
  # this service. It calls the Rust tool-server (:8084) for market-data tools and
  # QuestDB HTTP (:9000, internal — no Caddy auth on the private network) for the
  # options read layer, both over the 'stratai' network.
  #
  # NOTE: port 8086 is intentionally NOT published to the host yet. The desktop
  # reaches it via an authenticated Caddy gateway (added once the tool-server is
  # hosted and the end-to-end path is verified), mirroring the QuestDB gateway.
  deep-quant:
    build:
      context: ./agents/deep-quant-loop
      dockerfile: Dockerfile
    container_name: stratai-deep-quant
    env_file: .env
    environment:
      DEEP_QUANT_HOST: "0.0.0.0"
      DEEP_QUANT_PORT: "8086"
      # Internal service wiring (stratai network hostnames).
      RUST_TOOL_SERVER_URL: "http://tool-server:8084"
      QUESTDB_HTTP_URL: "http://questdb:9000"
      # Kite proxy, for the F&O chains QuestDB does not hold. The ingested set is a
      # bounded ten underlyings (Kite's 3000-instrument WebSocket cap), so
      # `options.py` reads any other listed chain straight from the exchange through
      # the aggregator. Without this it would default to 127.0.0.1, which inside this
      # container is the deep-quant service itself, and every unconfigured underlying
      # would stay unavailable.
      KITE_API_URL: "http://aggregator:8087/api/kite"
      METRICS_PORT: "9109"
      # Event_Source for get_event_risk (earnings/results proximity).
      #
      # Points at THIS service's own /events/calendar adapter, over loopback
      # inside the container — deliberately not a service name. Loopback needs no
      # DNS, no compose network and no depends_on, so the value is byte-identical
      # in local dev and here, which is the usual place a second address drifts.
      # Safe against self-deadlock: the agent's tools are sync and LangChain runs
      # them via run_in_executor, and the route is a sync def on FastAPI's
      # threadpool, so neither side occupies the event loop that serves it.
      #
      # Unset this to disable event risk — get_event_risk then degrades to its
      # honest "no event source configured" marker, exactly as before.
      EVENT_CALENDAR_API_URL: "http://127.0.0.1:8086/events/calendar"
    networks: [stratai]
    depends_on:
      questdb:
        condition: service_healthy
      tool-server:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  # ── Web frontend (Next.js standalone, :3000) ─────────────────────────────────
  # The same codebase as the desktop shell, served as a website at
  # app.stratai.live. Reached through the Caddy gateway vhost — port 3000 is NOT
  # published to the host.
  #
  # Why this service holds NO gateway credential
  # --------------------------------------------
  # The `/api/*` route handlers exist because a browser cannot call the gateway
  # directly: infra/caddy/Caddyfile emits no CORS headers on /questdb, /deepquant
  # or /kite, and they sit behind basic auth. But those handlers only need that
  # credential when they go OUT through the public gateway. On this network they
  # talk to the services by hostname, and internal HTTP is unauthenticated by
  # design — QuestDB's auth is PG-wire only (QDB_PG_USER/QDB_PG_PASSWORD; :9000 is
  # not published and not protected), which is why deep-quant already reaches it
  # as plain `http://questdb:9000`.
  #
  # So the per-service overrides below are set INSTEAD OF STRATAI_HTTP_BASE_URL,
  # and QUESTDB_PASSWORD is deliberately absent. A compromised web container
  # therefore leaks no shared secret — it only has what it can already reach.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the JS bundle at build time (Next.js substitutes
        # NEXT_PUBLIC_* textually), so these CANNOT be moved to `environment:`.
        # Changing one requires a rebuild, not a restart.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api-web.stratai.live}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-https://dashboard.stratai.live}
        # The only sign-in surface. The terminal has no login form; it redirects
        # here and reads the .stratai.live session cookie the auth app sets.
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-https://auth.stratai.live}
        NEXT_PUBLIC_AUTH_SERVICE_URL: ${NEXT_PUBLIC_AUTH_SERVICE_URL:-https://api-web.stratai.live}
        # wss://, not ws:// — an https:// page cannot open an insecure socket.
        NEXT_PUBLIC_AGGREGATOR_WS_URL: ${NEXT_PUBLIC_AGGREGATOR_WS_URL:-wss://app-api.stratai.live/ws/aggregator}
        NEXT_PUBLIC_ALPHA_WS_URL: ${NEXT_PUBLIC_ALPHA_WS_URL:-wss://app-api.stratai.live/ws/alpha}
        NEXT_PUBLIC_PREDICTIVE_WS_URL: ${NEXT_PUBLIC_PREDICTIVE_WS_URL:-wss://app-api.stratai.live/ws/predictive}
        NEXT_PUBLIC_INSIGHT_WS_URL: ${NEXT_PUBLIC_INSIGHT_WS_URL:-wss://app-api.stratai.live/ws/insight}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://app-api.stratai.live/ws/aggregator}
        NEXT_PUBLIC_PROD: ${NEXT_PUBLIC_PROD:-true}
        # Closed-beta only: unlocks the RESEARCH recommendation surface
        # (FIND/DEBATE/QA, conviction score, journal). Regulated output — see
        # lib/sku.ts. Requires a REBUILD, not a restart, because NEXT_PUBLIC_* is
        # inlined into the bundle. Remove before public launch.
        NEXT_PUBLIC_RESEARCH_BETA_OPEN: ${NEXT_PUBLIC_RESEARCH_BETA_OPEN:-}
        NEXT_PUBLIC_LLM_GATEWAY: ${NEXT_PUBLIC_LLM_GATEWAY:-omniroute}
    container_name: stratai-frontend
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # ── Upstreams, by service name on this network ──────────────────────────
      # `app/api/_gateway.ts` prefers these explicit overrides over
      # STRATAI_HTTP_BASE_URL, so no request leaves the network and no basic-auth
      # credential is needed. Deliberately no QUESTDB_PASSWORD here.
      KITE_API_URL: "http://aggregator:8087/api/kite"
      QUESTDB_HTTP_URL: "http://questdb:9000"
      DEEP_QUANT_URL: "http://deep-quant:8086"
      QUANT_TOOL_SERVER_URL: "http://tool-server:8084"
      SENTIMENT_HTTP_URL: "http://sentiment:8090"
      # ── Feature kill switches, resolved per request ─────────────────────────
      # Unprefixed on purpose: Next only inlines NEXT_PUBLIC_* into the bundle, so
      # these stay server-side and a change here takes effect on restart with no
      # rebuild. See frontend/src/app/api/_featureSwitches.ts.
      #
      # FEATURE_ENFORCEMENT defaults to TRUE here, unlike everywhere else. Absent
      # or false means "this is local development", and `computeFeatureAccess`
      # then returns true for every feature regardless of plan — which on a public
      # site hands every premium capability to anyone who signs up. The default has
      # to be the safe one in the file that describes production, because the
      # failure mode of forgetting it is silent revenue loss, not an error.
      #
      # Two distinct things switch on together:
      #   * the UI begins honouring each user's `accessFlags` from /credit, so a
      #     free plan sees the locked placeholder + Upgrade CTA;
      #   * the server-side kill switches below become load-bearing —
      #     `assertFeatureEnabled` consults them in the request path.
      #
      # SCOPE, so this is not mistaken for full entitlement enforcement: the proxy
      # routes do not resolve the caller's identity (the JWT is minted by the
      # separate api-web deployment and `/api/v1/internal/entitlement/{user_id}`
      # does not exist yet), so the SERVER enforces the deployment-wide switch
      # only. A subscriber-level bypass of the per-user gate remains possible on
      # the web path; the UI gate is an affordance there, not a boundary. The one
      # authoritative per-user gate today is agents/deep-quant-loop/entitlements.py.
      FEATURE_ENFORCEMENT: ${FEATURE_ENFORCEMENT:-true}
      # Each of these is the deployment-wide kill switch for one capability, ANDed
      # with the user's plan flag. `true` means "this deployment offers it at all",
      # NOT "everyone gets it" — flip one to false to disable a feature fleet-wide
      # (e.g. an LLM provider outage) with a container restart and no rebuild.
      ENABLE_DEEPSEEK_GLM: ${ENABLE_DEEPSEEK_GLM:-true}
      ENABLE_MULTI_MODEL: ${ENABLE_MULTI_MODEL:-true}
      ENABLE_GHOSTLINE: ${ENABLE_GHOSTLINE:-true}
      ENABLE_FOOTPRINT: ${ENABLE_FOOTPRINT:-true}
      ENABLE_TOPUP: ${ENABLE_TOPUP:-true}
      ENABLE_INSTANT_NEWS: ${ENABLE_INSTANT_NEWS:-true}
      ENABLE_ADVANCE_CHART: ${ENABLE_ADVANCE_CHART:-true}
    networks: [stratai]
    # Started, not healthy: the site must still load and show honest degraded
    # panels when a data service is down. Gating startup on them would turn a
    # single wedged upstream into a total outage of the app shell.
    depends_on:
      aggregator:
        condition: service_started
      deep-quant:
        condition: service_started
      tool-server:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════════
  # Monitoring stack
  # ══════════════════════════════════════════════════════════════════════════════
  # Every first-party service exports /metrics, /health and /ready on its slot in
  # the 9101-9110 block (see CLAUDE.md §10 and docs/MONITORING.md). None of those
  # ports are published to the host — Prometheus reaches them over this internal
  # network, which is the only thing that can.
  #
  # The whole point is answering "is it WORKING", not "is it alive": five of these
  # services are Kafka/WS loops that can wedge on a poll and keep answering health
  # checks forever while processing nothing. Each one exports
  # *_last_work_age_seconds against its own *_stall_threshold_seconds, and the
  # WorkStalled rule in infra/prometheus/alerts.yml compares them.
  #
  # ── Memory ──────────────────────────────────────────────────────────────────
  # This adds ~672 MB to a box whose existing services already commit ~6.3 GB of
  # 8 GB (see docker-compose.8gb.yml). It is genuinely tight. The retention caps
  # below are load-bearing, not tuning knobs — dropping them is how you OOM
  # QuestDB, which is already the component closest to its limit.

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: stratai-prometheus
    user: "65534:65534"   # nobody — the image's own default; named so the volume perms are obvious
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # BOTH caps matter. Time-based retention alone says nothing about disk on a
      # box with a 25-50 GB volume, and a cardinality mistake can fill it well
      # inside 7 days. Whichever limit is hit first wins.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      # Serving under a path prefix behind Caddy. route-prefix stays `/` because
      # the Caddyfile uses `handle_path`, which strips /prometheus before
      # proxying; external-url is what makes Prometheus' own redirects and the
      # alert "Source" links point back through the gateway rather than at an
      # unreachable internal host.
      - --web.external-url=https://app-api.stratai.live/prometheus
      - --web.route-prefix=/
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [stratai]
    ports:
      # Localhost only — public access is via Caddy + basic auth at
      # https://app-api.stratai.live/prometheus. Binding 0.0.0.0 here would expose
      # every metric in the fleet, unauthenticated, to the internet.
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      # Prometheus ships with wget in its base image (BusyBox), so this needs no
      # extra packages. /-/healthy is its own liveness route.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: stratai-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # No default admin password. An unauthenticated Grafana on a public box is
      # a read-only window into every metric in the fleet, so this follows the
      # QUESTDB_PASSWORD precedent and refuses to start without it.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}"
      # Served under /grafana by Caddy. Unlike Prometheus, Grafana needs to know
      # about its own sub-path (serve_from_sub_path) to emit correct asset URLs —
      # without it the app loads a blank page with 404s on every JS bundle.
      GF_SERVER_ROOT_URL: "https://app-api.stratai.live/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Nobody signs up for an internal monitoring instance.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Keep the container from phoning home on an install this small.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Alerting UI off: rules live in infra/prometheus/alerts.yml and are
      # evaluated by Prometheus. Two rule engines with two definitions of
      # "stalled" is how you get alerts that disagree with the dashboard.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
    volumes:
      # Datasource + dashboard providers, and the dashboards themselves — all in
      # git. Anything clicked into the UI lives only in grafana_data and is lost
      # with the volume, which is why the provider is marked allowUiUpdates:false.
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [stratai]
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 192m
    restart: unless-stopped

  # Container-level metrics: restart counts, OOM kills, and real cgroup memory
  # usage against each mem_limit. No in-process exporter can report any of these —
  # a process cannot tell you it was killed. On a box this tightly committed,
  # working-set vs limit is the most useful capacity signal there is.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: stratai-cadvisor
    # cAdvisor reads the host's cgroup and container state; it cannot work from
    # inside a normal container sandbox. This is the documented deployment and
    # the reason it is bound to localhost and never routed through Caddy.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # cAdvisor's default metric set is enormous and would dominate the 2 GB
      # retention budget. Disable the collectors nothing here reads; the scrape
      # config also keeps only a whitelist (metric_relabel_configs).
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    networks: [stratai]
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 64m
    restart: unless-stopped

  # Probes the surfaces that have no metrics endpoint of their own — the WS feeds,
  # Kafka, QuestDB's PG wire — and answers a question no in-process metric can:
  # "can this be reached from a container that is not it".
  #
  # The two disagree in the case that matters most. deep-quant's metrics listener
  # runs on its own thread specifically so it survives a wedged asyncio loop,
  # which means a green :9109 says nothing about whether /run still answers. The
  # blackbox probe against :8086 is what closes that gap.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: stratai-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [stratai]
    # Not published at all. Only Prometheus talks to it, over this network.
    mem_limit: 32m
    restart: unless-stopped

  # The admin panel's endpoint — one JSON contract at /api/status, so the panel
  # never learns PromQL and never learns that each service prefixes its metrics
  # differently. See status-api/src/model.rs for the wire shape.
  #
  # Deliberately a separate container from Prometheus, and deliberately holding
  # its own reqwest client: when Prometheus is unreachable it falls back to
  # probing each service's /ready directly, so the panel still gets real
  # per-service readiness. Monitoring that dies with what it monitors is the
  # failure this split exists to prevent.
  #
  # :9110 is both the API port and this service's own Prometheus slot —
  # /metrics, /health and /ready ride the same axum router as /api/status. It is
  # the only service in the fleet that shares a port that way.
  status-api:
    build:
      context: .
      dockerfile: status-api/Dockerfile
    container_name: stratai-status-api
    env_file: .env
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      # See the METRICS_PORT note on the ingestion service: set explicitly
      # because every service here shares env_file: .env and reads the same
      # variable name.
      METRICS_PORT: "9110"
      # CORS is restricted to the dashboard origin. Never widen this to `*` —
      # a wildcard would let any page a logged-in operator visits read the
      # fleet's internal topology. Comma-separated for staging origins.
      STATUS_API_CORS_ORIGINS: "${STATUS_API_CORS_ORIGINS:-https://dashboard.stratai.live}"
      RUST_LOG: info
    networks: [stratai]
    ports:
      # Localhost only, like the rest of the stack — public access is via Caddy
      # at https://app-api.stratai.live/status.
      - "127.0.0.1:9110:9110"
    depends_on:
      # `service_started`, not `service_healthy`: status-api must come up and
      # report "prometheus unreachable" even when Prometheus is broken. Gating
      # on Prometheus health would take the status page down with it.
      prometheus:
        condition: service_started
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9110/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
