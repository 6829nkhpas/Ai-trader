# ──────────────────────────────────────────────────────────────────────────────
# 8 GB memory-tuned OVERRIDE for docker-compose.prod.yml
# ──────────────────────────────────────────────────────────────────────────────
# The base prod file's mem_limits sum to ~9.5 GB, which overflows a 4vCPU/8GB
# droplet. This override trims each service so the stack fits within ~6.3 GB,
# leaving ~1.7 GB for the OS + Docker daemon.
#
# Usage on the droplet:
#   docker compose -f docker-compose.prod.yml -f docker-compose.8gb.yml up -d --build
#
# NOTES:
#   - Do NOT enable the `platform` profile (auth/payment) on 8 GB — no headroom.
#   - QuestDB at 2.5 GB is fine for a light beta but can pressure under heavy
#     history backfills. If you see QuestDB OOM-restart, move to s-8vcpu-16gb.
#
# ── Monitoring stack (added by the service-monitoring work) ──────────────────
# The base file allocates 736 MB to prometheus/grafana/cadvisor/blackbox and the
# status-api. On an 8 GB box that does not fit on top of the existing ~6.4 GB, so
# it is trimmed to 528 MB here (prometheus 256 + grafana 112 + cadvisor 64 +
# blackbox 32 + status-api 64) and partly paid for by taking a further 256 MB off
# QuestDB.
#
# That trade is the honest one to make: QuestDB is the component closest to its
# limit, but it degrades gracefully under memory pressure (slower queries, more
# disk spill) whereas monitoring that OOMs stops answering the question "is
# anything broken" — and it stops answering it precisely when the box is under
# the load that would break something. If QuestDB starts OOM-restarting after
# this lands, the documented fix remains moving to a 16 GB instance rather than
# squeezing either side further.
#
# Running total: ~7.02 GB committed of 8 GB (6.56 existing + 0.53 monitoring
# + 0.19 frontend − 0.25 reclaimed), leaving ~1 GB for the OS + Docker daemon.
#
# ── The build, not the runtime, is what is actually tight ────────────────────
# Every mem_limit here caps a RUNNING container. `redeploy.sh` builds on this same
# box, and `next build --turbopack` needs far more memory than the 192 MB the
# frontend then runs in — it is the heaviest build in the stack. With ~1 GB free
# and no swap configured, that build is the most likely thing to OOM, and the
# kernel may well pick QuestDB rather than the build to kill. See the note above
# the build loop in redeploy.sh for the options; building the image in CI and
# pulling it here is the one that removes the problem rather than deferring it.
# ──────────────────────────────────────────────────────────────────────────────

services:
  redpanda:
    mem_limit: 1200m

  questdb:
    # 2560m in the base 8gb tuning; 256m of that now funds the monitoring stack.
    mem_limit: 2304m
    environment:
      QDB_SHARED_WORKER_COUNT: "2"

  redis:
    mem_limit: 200m

  ingestion:
    mem_limit: 320m

  alpha-terminal:
    mem_limit: 200m

  technical:
    mem_limit: 200m

  aggregator:
    mem_limit: 220m

  predictive:
    mem_limit: 200m

  quant-rag:
    mem_limit: 300m

  sentiment:
    mem_limit: 320m

  # AI analysis service. Mostly I/O-bound (LLM + tool-server round-trips), but
  # langgraph/langchain carry a sizeable resident footprint. This brings the
  # 8 GB box to ~6.75 GB committed; once the Rust tool-server is added too the
  # box is near capacity — plan to move to s-8vcpu-16gb for comfortable headroom.
  tool-server:
    mem_limit: 200m

  deep-quant:
    # 512m -> 576m for the durable-state work: an aiosqlite connection for the
    # LangGraph checkpointer plus the session store's short-lived connections and
    # stream-frame batch buffers. The +64m is PRECAUTIONARY, not measured — WAL
    # SQLite with short connections adds little RSS. Measure with
    # `docker stats stratai-deep-quant` under a concurrent FIND load and pull this
    # back if the working set stays near the old ceiling; this box is already at
    # ~6.75 GB committed and headroom here is not free.
    mem_limit: 576m

  # The Next.js web app (app.stratai.live).
  #
  # 192m, down from 512m in the base file, and that is measured rather than
  # guessed: the built image idles at 38 MiB and peaked at 41 MiB under 60
  # concurrent full page loads. Next's standalone server holds almost nothing —
  # the bundle and the ~31 MB TradingView library are static files streamed off
  # disk, and every data call is a pass-through proxy that never buffers a
  # response (see app/api/_proxy.ts, which hands upstream.body straight back).
  #
  # 192m leaves roughly 4.5x the observed peak for the Node heap to grow into
  # under sustained traffic. If it ever OOMs, that is a real signal worth reading
  # as a leak rather than a limit to raise.
  # frontend: removed — migrated to Vercel



  # ── Monitoring stack ────────────────────────────────────────────────────────
  # 736m in the base file → 528m here. Every one of these is trimmed rather than
  # dropped: a monitoring stack that is partly deployed reports partial health,
  # which is worse than none because the gaps are invisible.

  prometheus:
    # 384m → 256m. The binding constraint on Prometheus memory is active series
    # count, not the retention window, and this fleet is small (10 services,
    # ~30 series each, plus a whitelisted cAdvisor subset). The retention flags
    # in the base file cap disk, not RAM — do not relax them to compensate.
    mem_limit: 256m

  grafana:
    # 192m → 112m. Enough for the provisioned dashboards on the sqlite backend.
    # Grafana's footprint scales with concurrent viewers, and this instance has
    # at most a couple.
    mem_limit: 112m

  cadvisor:
    # Unchanged. cAdvisor is already near its floor, and it is the only source of
    # OOM-kill and restart data — the signals that matter most on the box where
    # memory is tight enough to need them.
    mem_limit: 64m

  blackbox:
    # Unchanged; already minimal.
    mem_limit: 32m

  status-api:
    # Unchanged at the base 64m. This is the last thing to shrink: it is what
    # the admin panel reads, and it is the component that still answers when
    # Prometheus itself is the thing that died.
    mem_limit: 64m
