# ──────────────────────────────────────────────────────────────────────────────
# Strat Ai — Production Docker Compose
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker-compose up -d --build          # Build and start all services
#   docker-compose logs -f ingestion      # Tail a specific service
#   docker-compose down -v                # Stop all and remove volumes
#
# Prerequisites:
#   - Docker Engine 24+ / Docker Desktop
#   - .env file at monorepo root with required keys (see PRODUCTION_SETUP.md)
#
# ── Monitoring ────────────────────────────────────────────────────────────────
# This is the LOCAL/dev topology and is deliberately partial — it predates
# several services and uses different names for others (`predictive-agent` vs
# the prod `predictive`). The Prometheus/Grafana/cAdvisor/blackbox stack lives
# in docker-compose.prod.yml + docker-compose.8gb.yml, whose service names are
# what infra/prometheus/prometheus.yml targets; standing it up here would scrape
# names that do not exist.
#
# What IS wired here is each service's metrics port, published to the host so
# you can verify instrumentation directly:
#
#   curl -s localhost:9101/metrics | grep ingestion_work_completed_total
#   curl -s localhost:9101/ready          # {"status":"ok|stalled|idle", ...}
#
# METRICS_PORT is set explicitly rather than left to each binary's default
# because every service here shares `env_file: .env` and they all read the SAME
# variable name — one stray METRICS_PORT in .env would collapse them onto a
# single port. A value in `environment:` overrides env_file.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure: Kafka (via Redpanda) ──────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: stratai-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      - --set auto_create_topics_enabled=true
    ports:
      - "19092:19092"   # External Kafka API (host access)
      - "29092:29092"   # Internal Kafka API (inter-container)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'HEALTHY'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Infrastructure: QuestDB (Time-Series Archive) ─────────────────────────
  questdb:
    image: questdb/questdb:latest
    container_name: stratai-questdb
    ports:
      - "9000:9000"     # Web Console
      - "8812:8812"     # PostgreSQL wire protocol
      - "9009:9009"     # InfluxDB line protocol
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Infrastructure: Redis (Session Cache) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stratai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Service: Ingestion (Kite WS → Kafka) ─────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: stratai-ingestion
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      QUESTDB_URL: postgresql://questdb:8812/qdb
      METRICS_PORT: "9101"
      RUST_LOG: info
    ports:
      - "9101:9101"     # Prometheus /metrics, /health, /ready
    depends_on:
      redpanda:
        condition: service_healthy
      questdb:
        condition: service_healthy
    restart: unless-stopped

  # ── Service: Alpha Terminal (OHLC Engine → WS 8081) ───────────────────────
  alpha-terminal:
    build:
      context: .
      dockerfile: alpha-terminal/Dockerfile
    container_name: stratai-alpha-terminal
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      METRICS_PORT: "9103"
      RUST_LOG: info
    ports:
      - "8081:8081"
      - "9103:9103"     # Prometheus /metrics, /health, /ready
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ── Service: Aggregator (Decision Engine → WS 8080) ──────────────────────
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    container_name: stratai-aggregator
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      METRICS_PORT: "9102"
      RUST_LOG: info
    ports:
      - "8080:8080"
      - "9102:9102"     # Prometheus /metrics, /health, /ready
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ── Service: Predictive Agent (Ghost Line → WS 8082) ─────────────────────
  predictive-agent:
    build:
      context: .
      dockerfile: agents/predictive/Dockerfile
    container_name: stratai-predictive
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      METRICS_PORT: "9105"
      RUST_LOG: info
    ports:
      - "8082:8082"
      - "9105:9105"     # Prometheus /metrics, /health, /ready
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ── Service: Quant-RAG Agent (DeepSeek LLM → WS 8083) ────────────────────
  quant-rag-agent:
    build:
      context: .
      dockerfile: agents/quant-rag/Dockerfile
    container_name: stratai-quant-rag
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:29092
      METRICS_PORT: "9106"
      RUST_LOG: info
    ports:
      - "8083:8083"
      - "9106:9106"     # Prometheus /metrics, /health, /ready
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

# ── Persistent Volumes ──────────────────────────────────────────────────────
volumes:
  questdb_data:
