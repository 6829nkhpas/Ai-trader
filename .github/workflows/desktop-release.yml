name: desktop-release

# Builds the Strat Ai Tauri desktop app for Windows (x64) and macOS (universal:
# Intel + Apple Silicon) and publishes the installers as GitHub Release assets.
#
# Trigger:
#   - Push a version tag:      git tag v2.0.0 && git push origin v2.0.0
#   - Or run manually:         Actions -> desktop-release -> Run workflow (enter a tag)
#
# Output artifacts (attached to a DRAFT GitHub Release you then publish):
#   Windows: Strat Ai_<ver>_x64-setup.exe (NSIS)  and  Strat Ai_<ver>_x64_en-US.msi (WiX)
#   macOS:   Strat Ai_<ver>_universal.dmg          and  Strat Ai.app.tar.gz
#
# The macOS universal build runs on Apple Silicon runners and cross-compiles a
# fat binary, so a single .dmg works on both Intel and Apple Silicon Macs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # Main repo via the default GITHUB_TOKEN (no submodules yet — the charting
      # library lives in a PRIVATE repo the default token can't read).
      - name: Checkout
        uses: actions/checkout@v4

      # Fetch the private TradingView charting_library submodule using a PAT that
      # has read access to it (github.com/tradingview/charting_library). Create a
      # PAT on the account granted access and add it as the repo secret
      # CHARTING_LIBRARY_PAT. Without it the app builds with NO charts, because
      # `output: export` bundles frontend/public/static/charting_library into the
      # installer. The insteadOf rewrite scopes the PAT to submodule fetches only,
      # so the main repo stays on GITHUB_TOKEN.
      - name: Checkout private charting_library submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.CHARTING_LIBRARY_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          git config --global --unset url."https://x-access-token:${{ secrets.CHARTING_LIBRARY_PAT }}@github.com/".insteadOf || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify release credentials are present
        # FAIL FAST. QUESTDB_PASSWORD is baked into the binary via option_env! and
        # has NO fallback default (unlike QUESTDB_USER). If the secret is unset —
        # or simply not in scope, as on fork/PR-triggered runs — the build still
        # succeeds and publishes an installer whose gateway password falls back to
        # the local-dev default "quest". Caddy then 401s every authenticated route
        # (/questdb, /deepquant, /kite) while the unauthenticated /ws feeds keep
        # streaming, so the shipped app shows a live order book with an empty
        # chart, LTP and technical consensus. It "works on the developer's
        # machine" only because a local .env supplies the password at runtime.
        # Blocking the release is strictly better than shipping that.
        env:
          QUESTDB_PASSWORD: ${{ secrets.QUESTDB_PASSWORD }}
        # `shell: bash` is REQUIRED: this job runs a matrix over macos-latest and
        # windows-latest, and on Windows the default shell is PowerShell, which
        # parses `if [ -z ... ]` as a syntax error ("Missing '(' after 'if'").
        # GitHub ships bash on the Windows runners, so pinning it keeps one
        # portable script for both platforms.
        shell: bash
        run: |
          if [ -z "$QUESTDB_PASSWORD" ]; then
            echo "::error::QUESTDB_PASSWORD secret is empty or not in scope. The build would ship an installer that 401s on every authenticated backend route (blank chart / LTP / consensus, live order book). Set it under Settings > Secrets and variables > Actions, and note that fork-triggered runs do not receive secrets."
            exit 1
          fi
          echo "QUESTDB_PASSWORD present (${#QUESTDB_PASSWORD} chars) - gateway auth will be baked in."

      - name: Build app + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force Next.js to emit the static ../out bundle Tauri needs.
          NEXT_OUTPUT_EXPORT: "1"
          # ── Backend (auth + credit + LLM key) target, baked into the static
          #    export at build time. frontend/src/lib/env.ts REQUIRES these two,
          #    and .env.local is gitignored, so they MUST be provided here or the
          #    static export fails. Both are public URLs (no secrets). Overridable
          #    via repo variables if the backend host ever changes.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api-web.stratai.live' }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://dashboard.stratai.live' }}
          # Broker/portfolio calls (legacy AUTH_SERVICE_URL) also target the same
          # deployed backend in shipped builds.
          NEXT_PUBLIC_AUTH_SERVICE_URL: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_URL || 'https://api-web.stratai.live' }}
          # Premium-feature gating. false = every feature unlocked (safe for a
          # beta where users may not have active plans yet); set the repo variable
          # NEXT_PUBLIC_PROD=true to gate features by the user's plan accessFlags
          # once subscriptions are provisioned.
          NEXT_PUBLIC_PROD: ${{ vars.NEXT_PUBLIC_PROD || 'false' }}
          # LLM gateway the model selector targets. Beta uses omniroute (our
          # shared key/model/URL); production uses OpenRouter (per-user keys).
          # MUST match the server's OPENROUTER_BASE_URL + LLM_MODEL for the same
          # deployment. Set the repo variable to 'openrouter' for the prod build.
          NEXT_PUBLIC_LLM_GATEWAY: ${{ vars.NEXT_PUBLIC_LLM_GATEWAY || 'omniroute' }}
          # ── Live data-plane WebSocket feeds (baked into the static export) ──
          # Routed through the single TLS gateway wss://app-api.stratai.live/ws/* (see
          # infra/caddy/Caddyfile) so the shipped app never touches a raw droplet
          # IP:port. Only NEXT_PUBLIC_AGGREGATOR_WS_URL is actually consumed by the
          # Tauri build (the aggregator socket is opened from the webview); the
          # alpha/predictive/insight feeds are bridged in Rust via
          # STRATAI_WS_BASE_URL below (these three matter only for a plain-browser
          # `npm run dev`). All overridable via repo variables. To revert to
          # direct-IP: set the vars to ws://<host>:<port>.
          NEXT_PUBLIC_AGGREGATOR_WS_URL: ${{ vars.NEXT_PUBLIC_AGGREGATOR_WS_URL || 'wss://app-api.stratai.live/ws/aggregator' }}
          NEXT_PUBLIC_ALPHA_WS_URL: ${{ vars.NEXT_PUBLIC_ALPHA_WS_URL || 'wss://app-api.stratai.live/ws/alpha' }}
          NEXT_PUBLIC_PREDICTIVE_WS_URL: ${{ vars.NEXT_PUBLIC_PREDICTIVE_WS_URL || 'wss://app-api.stratai.live/ws/predictive' }}
          NEXT_PUBLIC_INSIGHT_WS_URL: ${{ vars.NEXT_PUBLIC_INSIGHT_WS_URL || 'wss://app-api.stratai.live/ws/insight' }}
          # ── Thin-client backend target (baked into the binary at compile time) ──
          # server.rs reads these via option_env! so shipped installers connect to
          # the droplet with the shared beta QuestDB credentials out of the box.
          # Set these as repo secrets: Settings → Secrets and variables → Actions.
          # Fallback default keeps the host usable even if the secret is unset.
          # Used for the raw-TCP services that can't sit behind an HTTPS path:
          # QuestDB PG wire (:8812), ingestion control (:8085), Kite OAuth (:8087).
          # Points at the domain (resolves to the droplet) so shipped builds carry
          # NO raw IP. The HTTP/WS feeds use STRATAI_HTTP_BASE_URL / _WS_BASE_URL.
          STRATAI_SERVER_HOST: ${{ secrets.STRATAI_SERVER_HOST || 'app-api.stratai.live' }}
          # Public WSS gateway base for the Rust live-feed bridges (OHLC/predictive/
          # insight). When set, server::feed_ws_url routes them through the TLS
          # domain (wss://app-api.stratai.live/ws/<feed>) instead of ws://<host>:<port>.
          # Baked via option_env! in server.rs. Clear the var to fall back to
          # direct-IP mode. QuestDB (:9000) + deep-quant (:8086) stay on
          # STRATAI_SERVER_HOST — only the live WS feeds move to the domain.
          STRATAI_WS_BASE_URL: ${{ vars.STRATAI_WS_BASE_URL || 'wss://app-api.stratai.live/ws' }}
          # Public HTTPS gateway base for the request/response services. When set,
          # server::questdb_http_url + server::deep_quant_url route through the TLS
          # domain (https://app-api.stratai.live/questdb, …/deepquant) instead of
          # http://<host>:9000 / :8086. Baked via option_env! in server.rs. Clear
          # the var to fall back to direct-IP mode. PG wire (:8812) stays on
          # STRATAI_SERVER_HOST (raw TCP, not HTTP).
          STRATAI_HTTP_BASE_URL: ${{ vars.STRATAI_HTTP_BASE_URL || 'https://app-api.stratai.live' }}
          QUESTDB_USER: ${{ secrets.QUESTDB_USER || 'admin' }}
          QUESTDB_PASSWORD: ${{ secrets.QUESTDB_PASSWORD }}
          # ── LLM / Sentiment / Deep Quant config (baked via option_env!) ──
          # These are read by services/llm.rs and commands/sentiment.rs at compile
          # time so the shipped binary has working LLM credentials out of the box.
          # Set as repo secrets: Settings → Secrets and variables → Actions.
          LLM_API_URL: ${{ secrets.LLM_API_URL || 'https://omniroute.premraj.online/v1/chat/completions' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-5.5' }}
          LLM_EFFORT: ${{ secrets.LLM_EFFORT || 'high' }}
          # The JSON body KEY that carries LLM_EFFORT — not the value. This
          # defaulted to 'high', producing {"high":"high"}, which every gateway
          # silently ignores, so reasoning effort was never actually applied.
          LLM_EFFORT_FIELD: ${{ secrets.LLM_EFFORT_FIELD || 'reasoning_effort' }}
          # ── Updater signing (REQUIRED for auto-update) ──
          # Signs the updater artifacts with the private half of the keypair whose
          # public key is pinned in tauri.conf.json (plugins.updater.pubkey). An
          # installed app only accepts an update whose signature verifies against
          # that pinned key, so these MUST stay in sync: rotating the key means
          # every already-installed client stops updating until it is reinstalled.
          # The password secret is intentionally EMPTY (the key has no passphrase);
          # it must still exist, or signing prompts and the build hangs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── macOS code signing + notarization (OPTIONAL) ──
          # Uncomment and set these repo secrets to ship signed, notarized Macs
          # (removes the "unidentified developer" Gatekeeper warning):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Windows code signing (OPTIONAL) ──
          # Configure a signing cert in tauri.conf.json + secrets to remove the
          # SmartScreen warning. Left unsigned by default.
        with:
          projectPath: frontend
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Strat Ai __VERSION__"
          releaseBody: |
            Strat Ai desktop builds.

            **Windows:** download the `.exe` (recommended) or `.msi` and run it.
            **macOS:** download the `.dmg`, open it, drag Strat Ai to Applications.

            These builds are currently unsigned — see the install notes if your OS
            shows a security warning.
          releaseDraft: true
          prerelease: false
          # We publish our OWN per-platform manifest to the self-hosted feed (see
          # the next step), so tauri-action's combined latest.json is not used.
          # Each matrix leg would otherwise emit its own copy and the second to
          # finish would clobber the first.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # ── Publish the signed build to the self-hosted update feed ─────────────
      #
      # The updater cannot read GitHub Release assets: this repo is PRIVATE, so
      # every asset URL requires an Authorization header that we would then have
      # to ship inside the client. Instead the signed installer and a manifest go
      # to the droplet, served behind the gateway's existing basic-auth at
      # /updates/* — the same credential the app already carries.
      #
      # Runs per matrix leg and writes into a platform-scoped directory, so the
      # Windows and macOS legs never overwrite each other's manifest.
      - name: Publish update to the self-hosted feed
        if: ${{ success() }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::warning::DEPLOY_HOST or DEPLOY_SSH_KEY not set — skipping update-feed publish. The GitHub Release asset is still produced, but installed apps will NOT see this version."
            exit 0
          fi

          # Platform key must match what the updater requests. tauri.conf.json
          # points at /updates/{{target}}-{{arch}}/latest.json, and the plugin
          # substitutes Rust's target_os / target_arch.
          # Platform keys must match what the updater ASKS FOR. tauri.conf.json
          # points at /updates/{{target}}-{{arch}}/latest.json, and the plugin
          # substitutes Rust's target_os and target_arch of the RUNNING build.
          #
          # That last part is the subtle one for macOS: this job produces a
          # UNIVERSAL binary, but `{{arch}}` is resolved on the client and is
          # never "universal" — an Apple Silicon Mac asks for darwin-aarch64 and
          # an Intel Mac asks for darwin-x86_64. Publishing to a single
          # "darwin-universal" directory would 404 for every Mac. So the one
          # universal artifact is published under BOTH arch keys.
          case "${{ matrix.platform }}" in
            windows-latest)
              PLATFORM_DIRS="windows-x86_64"
              # NSIS is the Windows updater format. The .msi is published to the
              # GitHub Release for fresh installs but is not an update target.
              BUNDLE_GLOB="frontend/src-tauri/target/release/bundle/nsis/*-setup.exe"
              ;;
            macos-latest)
              PLATFORM_DIRS="darwin-aarch64 darwin-x86_64"
              # macOS updates ship as the tarred .app, never the .dmg.
              BUNDLE_GLOB="frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz"
              ;;
            *)
              echo "::error::Unhandled platform ${{ matrix.platform }}"; exit 1 ;;
          esac

          ARTIFACT="$(ls -1 $BUNDLE_GLOB 2>/dev/null | head -1 || true)"
          if [ -z "$ARTIFACT" ]; then
            echo "::error::No updater artifact matched $BUNDLE_GLOB. Is bundle.createUpdaterArtifacts still true in tauri.conf.json?"
            exit 1
          fi
          SIG_FILE="${ARTIFACT}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::Missing $SIG_FILE — the build was not signed. Check TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi

          # The manifest version MUST be the version baked into the bundle, not the
          # git tag. The updater compares `latest.json.version` against the running
          # app's own version — which comes from tauri.conf.json — so a manifest
          # that disagrees with its own artifact is silently inert: the failed
          # v1.0.0 run published `"version": "1.0.0"` pointing at
          # `Strat Ai_2.0.0_x64-setup.exe`, and every installed 2.0.0 client would
          # have compared 1.0.0 against 2.0.0 and correctly decided there was
          # nothing to do. No error anywhere; the feed just never updates anyone.
          #
          # `node -p` rather than jq: Setup Node ran above, so Node is guaranteed on
          # both runners, and it parses the JSON properly instead of grepping it.
          VERSION="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read version from frontend/src-tauri/tauri.conf.json."
            exit 1
          fi
          # A tag that disagrees with the bundle is a release-hygiene problem, not a
          # feed problem, so warn rather than fail: the artifacts are good and the
          # manifest is now correct regardless of what the tag says.
          if [ "$VERSION" != "${RELEASE_TAG#v}" ]; then
            echo "::warning::Tag $RELEASE_TAG does not match the bundle version $VERSION (frontend/src-tauri/tauri.conf.json). Publishing the feed as v$VERSION, which is what installed clients compare against. Tag v$VERSION next time so the GitHub Release and the update feed agree."
          fi
          BASENAME="$(basename "$ARTIFACT")"
          SIGNATURE="$(cat "$SIG_FILE")"

          # URL-encode spaces in the filename ("Strat Ai_…"); the updater fetches
          # this URL verbatim, so an unencoded space yields a 404.
          ENCODED_NAME="$(printf '%s' "$BASENAME" | sed 's/ /%20/g')"

          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          SSH_OPTS="-i deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          for PLATFORM_DIR in $PLATFORM_DIRS; do
            TARGET="/srv/updates/$PLATFORM_DIR"

            # The `platforms` key must equal the "<target>-<arch>" the client
            # computes for itself, or the updater treats the manifest as having
            # no build for this machine.
            cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "Strat Ai $RELEASE_TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "$PLATFORM_DIR": {
                "signature": "$SIGNATURE",
                "url": "https://app-api.stratai.live/updates/$PLATFORM_DIR/$ENCODED_NAME"
              }
            }
          }
          JSON

            echo "Publishing $BASENAME (v$VERSION) -> $PLATFORM_DIR"
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET'"
            # NOTE — do NOT shell-quote the remote path (`…:'$TARGET/'`).
            #
            # `ssh` above passes its argument to a remote SHELL, which strips the
            # single quotes. `scp` does not: since OpenSSH 9.0 it speaks the SFTP
            # protocol by default, so the remote path is sent to an SFTP server
            # verbatim with no shell in the loop. Quotes therefore become literal
            # characters in the filename, and the upload fails with
            #   scp: dest open "'/srv/updates/darwin-aarch64/'": No such file or directory
            # against a directory `mkdir -p` had just created successfully — the
            # confusing part, because the error names a path that plainly exists.
            #
            # These paths are literals built from $PLATFORM_DIR (`windows-x86_64`,
            # `darwin-aarch64`, `darwin-x86_64`), so there is nothing to quote for:
            # no spaces, no globs. The local side still needs its double quotes —
            # $ARTIFACT does contain a space ("Strat Ai.app.tar.gz").
            scp $SSH_OPTS "$ARTIFACT" "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/"
            # Manifest LAST: until it names the new file, clients keep resolving
            # the previous version, so there is never a window in which the feed
            # advertises a build whose upload has not finished.
            scp $SSH_OPTS latest.json "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/latest.json"
            echo "  -> https://app-api.stratai.live/updates/$PLATFORM_DIR/latest.json"
          done

          rm -f deploy_key latest.json
