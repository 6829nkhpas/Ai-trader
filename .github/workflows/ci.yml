name: ci

# Verification for the develop -> staging -> main ladder.
#
# Runs on PRs into any long-lived branch and on pushes to develop/staging, so a
# regression is caught before it reaches production. main is deliberately NOT a
# push trigger here — by the time code lands there it has already passed this
# workflow on the staging PR, and deploy-server.yml owns that event.
#
# Jobs are path-filtered: a docs-only PR should not spend 20 minutes building
# Rust. Each job self-skips when its paths are untouched.

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [develop, staging]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter calls the PR "list files" API to work out what changed.
  # Without this it fails with "Resource not accessible by integration", every
  # downstream job skips, and CI would go green on an unverified change.
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      tauri: ${{ steps.filter.outputs.tauri }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/tsconfig.json'
              - 'frontend/vitest.config.*'
            tauri:
              - 'frontend/src-tauri/**'
              - 'quant-core/**'
              - 'shared_protos/**'
            rust:
              - 'aggregator/**'
              - 'ingestion/**'
              - 'alpha-terminal/**'
              - 'agents/predictive/**'
              - 'agents/technical/**'
              - 'agents/quant-rag/**'
              - 'tool-server/**'
              - 'quant-core/**'
              - 'shared_protos/**'
            python:
              - 'agents/deep-quant-loop/**'

  frontend:
    name: Frontend — types + tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # NOTE: tsc surfaces pre-existing errors in WatchlingPanel.tsx and the
      # TradingView codegen assets that fail on a clean tree too (see
      # CONTRIBUTING.md). They are filtered out so this job reports only
      # regressions introduced by the change under review.
      - name: Typecheck
        working-directory: frontend
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 \
            | grep -v 'WatchlistPanel\|charting_library\|datafeeds/udf' \
            | tee tsc.log
          if [ -s tsc.log ]; then
            echo "::error::tsc reported errors outside the known-failing files."
            exit 1
          fi

      - name: Tests
        working-directory: frontend
        run: npx vitest run --reporter=dot

  tauri-backend:
    name: Tauri backend — cargo build + test
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Tauri's Linux build needs GTK/WebKit system libraries.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf protobuf-compiler

      - name: Build
        working-directory: frontend/src-tauri
        run: cargo build --lib --locked

      - name: Test
        working-directory: frontend/src-tauri
        run: cargo test --lib --locked

  rust-services:
    name: Rust services — cargo check + test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - aggregator
          - ingestion
          - alpha-terminal
          - agents/predictive
          - agents/technical
          - agents/quant-rag
          - tool-server
          - quant-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Check
        working-directory: ${{ matrix.crate }}
        run: cargo check --locked

      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked

  python-agent:
    name: Deep-quant agent — pytest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/deep-quant-loop/requirements.txt

      - name: Install
        working-directory: agents/deep-quant-loop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        working-directory: agents/deep-quant-loop
        run: python -m pytest -q

  # A single required-status target. Point branch protection at this one check
  # rather than every job above, so path-filtered skips don't block a merge.
  #
  # `changes` is in `needs` deliberately: if it fails, every job below it skips,
  # and treating skipped as OK would report green for a change nothing verified.
  # A skip is only trustworthy when the filter that caused it actually ran.
  ci-ok:
    name: CI
    if: always()
    needs: [changes, frontend, tauri-backend, rust-services, python-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the change detector ran
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The 'Detect changed areas' job reported '${{ needs.changes.result }}'."
          echo "Every build job skips when it fails, so nothing was actually verified."
          exit 1

      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job reported '$r'."; exit 1 ;;
            esac
          done
          echo "All CI jobs passed or were skipped."
