name: branch-guard

# Enforces the branching model documented in CONTRIBUTING.md.
#
# WHY THIS EXISTS: GitHub branch protection is unavailable on this repository
# (private repo on a free plan — the protection API returns 403 "Upgrade to
# GitHub Pro"). This workflow is a best-effort substitute. It reports violations
# AFTER they land; it cannot block them. Once the repo is on Pro or made public,
# enable real protection (commands are in CONTRIBUTING.md) — this then becomes a
# redundant but harmless second layer.
#
# Two rules:
#   1. main and staging accept merges, not direct pushes.
#   2. PRs into main may only come from staging or hotfix/*.

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read

jobs:
  direct-push:
    name: No direct pushes to protected branches
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Reject pushes that did not come from a pull request
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH actor=$ACTOR sha=$SHA"

          # An initial push that creates the branch is legitimate.
          if [ "$CREATED" = "true" ]; then
            echo "::notice::Branch $BRANCH was just created; nothing to enforce."
            exit 0
          fi

          # Ask GitHub whether this commit arrived via a merged PR. This is the
          # reliable signal: the repo allows merge-commit, squash AND rebase
          # merges, and the latter two produce SINGLE-parent commits, so a
          # parent-count heuristic would wrongly reject legitimate squash/rebase
          # merges into main.
          #
          # The filter is deliberately defensive. If the API returns an error
          # OBJECT instead of an array, a naive `.[] | select(...)` iterates the
          # object's string values and jq aborts — which, under `set -euo
          # pipefail`, would fail this job and accuse an innocent commit. `.[]?`
          # plus `objects` discards anything that isn't a PR record, and
          # `// empty` turns "no match" into empty output rather than "null".
          # Verified against: merged PR, unmerged PR, [], error object, mixed.
          pr_ref=$(
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "$API/repos/$REPO/commits/$SHA/pulls" \
              | jq -r '[ .[]? | objects | select(.merged_at != null) ] | .[0] // empty | "#\(.number) into \(.base.ref)"'
          )

          if [ -n "$pr_ref" ]; then
            echo "::notice::Commit $SHA arrived on $BRANCH via merged PR $pr_ref. Allowed."
            exit 0
          fi

          # Fall back to the parent count: a true merge commit is still fine
          # even if the PR association lookup came back empty. -1 means the
          # response had no parents array at all (API error) — see below.
          parent_count=$(
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "$API/repos/$REPO/commits/$SHA" \
              | jq '.parents | if type == "array" then length else -1 end'
          )

          if [ "$parent_count" -ge 2 ]; then
            echo "::notice::Merge commit ($parent_count parents) on $BRANCH. Allowed."
            exit 0
          fi

          # Could not read the commit. Say so rather than accusing the author of
          # a direct push on the strength of a failed API call.
          if [ "$parent_count" -lt 0 ]; then
            echo "::warning::Could not determine how commit $SHA reached '$BRANCH' (GitHub API did not return commit data). Not treating this as a violation."
            exit 0
          fi

          echo "::error::Direct push to '$BRANCH' by '$ACTOR'. Commit $SHA has no merged PR and $parent_count parent(s)."
          echo ""
          echo "  '$BRANCH' is updated through approved pull requests only:"
          echo "    develop -> staging -> main"
          echo ""
          echo "  See CONTRIBUTING.md. To undo:"
          echo "    git revert $SHA"
          echo "  then reapply the change on a branch off develop and open a PR."
          exit 1

  pr-source:
    name: PRs into main come from staging or hotfix/*
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD_REF -> main"

          case "$HEAD_REF" in
            staging|hotfix/*)
              echo "::notice::'$HEAD_REF' is an allowed source for main."
              ;;
            *)
              echo "::error::PR into main from '$HEAD_REF' is not allowed."
              echo ""
              echo "  main accepts:"
              echo "    - staging     (the normal promotion path)"
              echo "    - hotfix/*    (urgent production fixes)"
              echo ""
              echo "  Retarget this PR at 'develop'. See CONTRIBUTING.md."
              exit 1
              ;;
          esac

  pr-source-staging:
    name: PRs into staging come from develop or hotfix/*
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD_REF -> staging"

          case "$HEAD_REF" in
            develop|hotfix/*)
              echo "::notice::'$HEAD_REF' is an allowed source for staging."
              ;;
            *)
              echo "::warning::PR into staging from '$HEAD_REF'. The normal path is develop -> staging; feature branches should merge into develop first. See CONTRIBUTING.md."
              ;;
          esac
