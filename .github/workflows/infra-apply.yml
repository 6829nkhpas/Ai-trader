name: infra-apply

# Apply OpenTofu on merge to main (or manual dispatch). Gated by the
# "production" GitHub Environment — add required reviewers there so every
# apply needs manual approval before it runs.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:    ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint:  ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_region:       ${{ vars.OCI_REGION }}
      TF_VAR_private_key_path: ${{ github.workspace }}/oci_api_key.pem
      TF_VAR_ssh_public_key_path: ${{ github.workspace }}/ssh_key.pub
      AWS_ACCESS_KEY_ID:     ${{ secrets.OCI_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize secret key files
        run: |
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${{ github.workspace }}/oci_api_key.pem"
          chmod 600 "${{ github.workspace }}/oci_api_key.pem"
          printf '%s' "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > "${{ github.workspace }}/ssh_key.pub"

      - name: Generate remote-state backend block
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform { backend "s3" {} }
          EOF

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      - name: Init (remote state)
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=ai-trader/oci/terraform.tfstate" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="endpoints={s3=\"https://${{ vars.TFSTATE_NAMESPACE }}.compat.objectstorage.${{ vars.OCI_REGION }}.oraclecloud.com\"}" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="use_path_style=true"

      - name: Apply
        run: tofu apply -input=false -auto-approve
