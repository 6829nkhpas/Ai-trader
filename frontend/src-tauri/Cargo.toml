[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# Tauri-free shared quant engine (indicators, patterns, consensus, validators).
# Also consumed by the standalone tool-server binary so both share one source
# of truth. Re-exported by src/quant/mod.rs to preserve existing crate::quant::*
# import paths.
quant-core = { path = "../../quant-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
tokio = { version = "1", features = ["full"] }
# `rustls-tls-webpki-roots` enables wss:// (the app-api.stratai.live gateway); pure
# Rust, cross-platform, bundles Mozilla roots that trust Let's Encrypt.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5.0"
axum = "0.7"

# ── Historical Pipeline (Cold-Storage Ingestion) ────────────────────────
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
dotenvy = "0.15"
urlencoding = "2.1"

# ── Local Workspace Persistence (SQLite) ────────────────────────────────
# rusqlite 0.31 uses libsqlite3-sys 0.28 — same as sqlx, avoiding link conflicts.
rusqlite = { version = "0.31", features = ["bundled"] }

# ── Alpha Crucible — Audit Logger Support ───────────────────────────────
once_cell = "1.19"

# ══════════════════════════════════════════════════════════════════════════
# Alpha Crucible — API Contract Testing
# ══════════════════════════════════════════════════════════════════════════
[dev-dependencies]
mockito = "1.0"
tokio = { version = "1", features = ["full", "test-util", "macros", "rt-multi-thread"] }
serde_json = "1.0"
# Property-based testing — deep-quant-analysis-hardening (cases = 100)
proptest = "1"
