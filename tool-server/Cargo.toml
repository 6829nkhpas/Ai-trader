[package]
name = "tool-server"
version = "0.1.0"
edition = "2021"
description = "Standalone (Tauri-free) market-data tool server for the deep-quant LangGraph agent. Serves /tools/* over :8084, backed by QuestDB and the shared quant-core engine."

[[bin]]
name = "tool-server"
path = "src/main.rs"

[dependencies]
quant-core = { path = "../quant-core" }
service-metrics = { path = "../service-metrics" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
urlencoding = "2.1"
# Internal service credential for the watcher's POST /resume (X-StratAI-Service).
# All three are ALREADY in Cargo.lock as transitive dependencies of the rustls/sqlx
# stack, so promoting them to direct dependencies adds no compilation and no new
# supply-chain surface. Hand-rolling SHA-256 instead would be more code AND a
# hand-rolled security primitive.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
# `ServiceExt::oneshot` — drives the real router in-process so the metrics
# middleware can be tested against the actual route table rather than a stub.
tower = { version = "0.5", features = ["util"] }
